name: dotnet-test

on:
    pull_request:
        types:
            - opened
            - synchronize
        paths:
            - 'SerializableFormat.slnx'
            - 'src/**'
            - 'tests/**'
    push:
        branches:
            - main
        paths:
            - 'SerializableFormat.slnx'
            - 'src/**'
            - 'tests/**'
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

jobs:
    test:
        runs-on: windows-latest
        strategy:
            matrix:
                include:
                    - runtime-dotnet-version: '5.0.x'
                      framework: 'net5.0'
                    - runtime-dotnet-version: '6.0.x'
                      framework: 'net6.0'
                    - runtime-dotnet-version: '7.0.x'
                      framework: 'net7.0'
                    - runtime-dotnet-version: '8.0.x'
                      framework: 'net8.0'
                    - runtime-dotnet-version: '9.0.x'
                      framework: 'net9.0'
        steps:
            # ghasec-ignore: unpinned-action
            - uses: AndanteTribe/Actions/actions/checkout@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
              with:
                  fetch-depth: 0
            # ghasec-ignore: unpinned-action
            - uses: AndanteTribe/Actions/actions/setup-dotnet@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
              with:
                  dotnet-version: |
                      10.0.x
                      ${{ matrix.runtime-dotnet-version }}
            - run: dotnet restore ./tests/SerializableFormat.Tests/SerializableFormat.Tests.csproj --property:TargetFramework=${{ matrix.framework }}
            - run: dotnet build ./tests/SerializableFormat.Tests/SerializableFormat.Tests.csproj --configuration Release --no-restore --framework ${{ matrix.framework }}
            - run: dotnet test ./tests/SerializableFormat.Tests/SerializableFormat.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --framework ${{ matrix.framework }}
            - name: Find coverage output path
              if: matrix.framework == 'net9.0'
              shell: pwsh
              run: |
                  $files = Get-ChildItem -Path . -Filter "coverage.cobertura.xml" -Recurse -File
                  foreach ($file in $files) {
                      Copy-Item -Path $file.FullName -Destination . -Force
                  }
            - name: Run ReportGenerator
              if: matrix.framework == 'net9.0'
              shell: pwsh
              run: |
                  dotnet tool install -g dotnet-reportgenerator-globaltool
                  reportgenerator -reports:"coverage.cobertura.xml" -targetdir:"report" -reporttypes:"Html;MarkdownSummary"
                  Get-Content report/Summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            # ghasec-ignore: unpinned-action
            - uses: AndanteTribe/Actions/actions/upload-artifact@main # zizmor: ignore[unpinned-uses] repository-local action reference is intentionally tracked on @main
              if: matrix.framework == 'net9.0'
              with:
                  name: coverage-report-${{ matrix.framework }}
                  path: report/
